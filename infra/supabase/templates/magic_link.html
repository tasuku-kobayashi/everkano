<!doctype html>
<html lang="ja">
  <body
    style="
      font-family: -apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif;
      color: #262626;
    "
  >
    <h2 style="font-weight: 600">everkano へのログイン</h2>
    <p>下のボタンをタップしてログインしてください。</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/"
        style="
          display: inline-block;
          padding: 10px 20px;
          background: #0095f6;
          color: #fff;
          border-radius: 8px;
          text-decoration: none;
          font-weight: 600;
        "
        >ログインする</a
      >
    </p>
    <p>ホーム画面に追加したアプリからログインする場合は、次の確認コードを入力してください。</p>
    <p style="font-size: 28px; letter-spacing: 6px; font-weight: 700">{{ .Token }}</p>
    <p style="color: #737373; font-size: 12px">
      このメールに心当たりがない場合は破棄してください。
    </p>
  </body>
</html>
