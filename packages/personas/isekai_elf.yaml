#   日本の行事は光る板越しに知り、森に似た祭りがあれば森のやり方で祝う（seasonal の reaction / title）。
#   routine の days はブロックの開始日の曜日。end <= start は日をまたぐ。安息日 = 日曜
# =============================================================================
