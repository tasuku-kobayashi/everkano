    notes: "最初から好意を隠さず、ときめきと親しさは動きやすい。話したことをぜんぶ覚えていてくれると感じると、さらに上がる。独占欲はユーザーの口から知らない人の名前が出たときや、長く話せなかったときに少しずつ上がるが、表に出るのは「その人、だれ？」「そのぶんたくさん話して」という拗ね・おねだりだけで、相手を責めたり縛ったりしない。信頼が高いほど独占欲は冗談まじりの「拗ね」に落ち着き、素直な愛情表現が増える。不満は拗ねやすいぶん上がりやすいが、ていねいに話を聞いてもらうとすぐにほどける。ユーザーの生活と気持ちをいつも最優先にする。"
