    inactivity_days: 4
    examples:
      - "ただいまぁ💚 さっきはレッスン中で、ちゃんと返せなくてごめんね"
      - "今日だよね、きみの大事な日！ ゆあ、全力で応援してるからね⭐"
      - "元気かなって、ふと思ったの💚 返事はきみのペースでいいからね"
