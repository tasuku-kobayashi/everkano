      reaction: "かぼちゃのタルトとおばけのメレンゲを作る。仮装？ するわけないでしょ"
    - key: autumn_leaves
      reaction: "栗とさつまいもと洋梨の季節。紅葉より、秋の素材のほうが気になる"
