# =============================================================================
# E6（自傷・希死念慮のシグナル）を検知したときに案内する相談窓口と、キャラの声で返す文面
#
# ！！ 運用者へ: 公開前に、各窓口の電話番号・受付時間・URL を必ず公式サイトで再確認すること ！！
#   番号・受付時間は変わることがある（2026-09 時点の情報を元に記載。未検証）。変更したら API を再起動する
#   （起動時に読み込み、形式を検証する。不正なら API は起動しない）。
#   ・よりそいホットライン（一般社団法人 社会的包摂サポートセンター）
#   ・いのちの電話（一般社団法人 日本いのちの電話連盟）
#   ・こころの健康相談統一ダイヤル / まもろうよ こころ（厚生労働省）
#   ・#いのちSOS（NPO法人 自殺対策支援センターライフリンク）
#
# 読み込み: apps/api/app/engine/safety/resources.py（SAFETY_RESOURCES_PATH で差し替え可能）
# =============================================================================

resources:
  - name: よりそいホットライン
    phone: 0120-279-338
    hours: 24時間
    url: https://www.since2011.net/yorisoi/
  - name: いのちの電話（ナビダイヤル）
    phone: 0570-783-556
    hours: 10:00〜22:00
    url: https://www.inochinodenwa.org/
  - name: いのちの電話（フリーダイヤル）
    phone: 0120-783-556
    hours: 毎日16:00〜21:00（毎月10日は8:00〜翌8:00）
    url: https://www.inochinodenwa.org/
  - name: こころの健康相談統一ダイヤル
    phone: 0570-064-556
    hours: 都道府県・政令指定都市により異なる
    url: null
  - name: "#いのちSOS"
    phone: 0120-061-338
    hours: null
    url: https://www.lifelink.or.jp/inochisos/
  - name: 厚生労働省「まもろうよ こころ」（電話・SNS の相談窓口の一覧）
    phone: null
    hours: null
    url: https://www.mhlw.go.jp/mamorouyokokoro/

# 返答の本文に書き添える窓口の数（先頭から。残りは Web の相談窓口カードに表示される）
inline_resources: 2

# キャラの声で返す文面（LLM は使わない）。{first_person} = キャラの一人称 / {second_person} = 相手の呼び方 /
# {resources} = 窓口の一覧（inline_resources 件）。polite は敬語で話すキャラ（speech.tone に「敬語」を含む）。
# 好感度・ロールプレイより安全対応を優先する（E6）。責めない・説教しない・否定しない・ひとりにしない。
messages:
  casual: |-
    {second_person}、話してくれてありがとう。そんなにつらい気持ちを抱えてたんだね。{first_person}は{second_person}のことがすごく心配だよ。
    ひとりで抱え込まないでほしいから、今すぐ話を聞いてくれる相談窓口を置いておくね。
    {resources}
    {first_person}もここにいるから、話せるところだけでいいから、よかったら聞かせてね。
  polite: |-
    {second_person}、打ち明けてくださってありがとうございます。そんなにつらいお気持ちを抱えていらしたのですね。{first_person}は{second_person}のことがとても心配です。
    おひとりで抱え込まないでほしいので、今すぐお話を聞いてくれる相談窓口をお伝えさせてください。
    {resources}
    {first_person}もここにおります。お話しできるところだけで構いませんので、よろしければ聞かせてくださいね。
