# =============================================================================
# CI — PR と main への push で実行する品質ゲート（開発依頼書 §15 / 受け入れ基準 A13・A14・A16）
#
#   checks : シークレット混入（A14）・スコープ外機能（A16）・シェルスクリプトの静的解析・
#            ペルソナ / seed.sql の整合性と未成年表現の検査・docker compose の API 設定の検査
#   web    : Next.js の lint / typecheck / test / build（ダミーの公開 env でビルド）
#   api-db : ローカル Supabase を起動し、RLS の pgTAP テスト（A13）・DB 型のずれ検出・
#            Python API の ruff / mypy / pytest（統合テストは同じ DB を使用）
#   e2e    : 受け入れ基準の Playwright E2E（apps/web/e2e）。所要時間が長いため
#            手動実行（Actions タブ → CI → Run workflow）のときだけ動く
#
# シークレットは一切使わない（LLM は mock、Embedding は hash、Supabase はローカルの既定値）。
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  SUPABASE_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  checks:
    name: Repo checks (secrets / scope / shellcheck / personas / compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: シークレット混入チェック（A14 / H7）
        run: bash scripts/check-secrets.sh

      - name: スコープ外機能チェック（A16 / §12）
        run: bash scripts/check-scope.sh

      - name: ShellCheck（scripts/*.sh）
        run: shellcheck -x scripts/*.sh

      - uses: astral-sh/setup-uv@v6

      # packages/personas/scripts/validate_personas.py（= pnpm personas:validate）:
      # YAML の必須項目・全キャラ 20 歳以上に加え、YAML / seed/feed.yaml / infra/supabase/seed.sql に
      # 未成年を想起させる表現が無いこと、seed.sql が generate_seed.py の生成結果と一致すること
      # （手編集・再生成忘れ）を検査する。API 側の scripts/validate_personas.py は Pydantic モデルの読込のみ
      - name: ペルソナ / seed.sql の整合性・未成年表現チェック（成人のみ）
        run: uv run --with pyyaml python packages/personas/scripts/validate_personas.py

      # setup-env.sh（.env.example）から作った apps/api/.env で docker compose の API が起動できること。
      # env_file の空の PERSONAS_DIR= / PROMPTS_DIR= がイメージの既定パスを空文字で上書きしないか検査する
      - name: docker compose の API 設定（PERSONAS_DIR / PROMPTS_DIR がイメージ内のパスになる）
        run: |
          status_file="${RUNNER_TEMP}/supabase-status.env"
          printf '%s\n' 'API_URL="http://127.0.0.1:54321"' \
            'DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"' \
            'ANON_KEY="ci-dummy-anon-key"' >"$status_file"
          bash scripts/setup-env.sh --status-file "$status_file"
          # 以前の .env.example から作った .env（空の PERSONAS_DIR= / PROMPTS_DIR= 入り）でも同じになること
          printf 'PERSONAS_DIR=\nPROMPTS_DIR=\n' >>apps/api/.env
          docker compose config --format json | jq -e '.services.api.environment
            | .PERSONAS_DIR == "/srv/everkano/personas" and .PROMPTS_DIR == "/srv/everkano/prompts"'

  # ---------------------------------------------------------------------------
  web:
    name: Web (lint / typecheck / test / build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # ビルド時の env 検証を通すためのダミー値（公開値のみ。実在のプロジェクトではない）
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_STORAGE_DRIVER: passthrough
    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager から決まる
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck (@everkano/shared)
        run: pnpm --filter @everkano/shared typecheck

      - name: Lint
        run: pnpm --filter @everkano/web lint

      - name: Typecheck
        run: pnpm --filter @everkano/web typecheck

      - name: Test
        run: pnpm --filter @everkano/web test

      - name: Build
        run: pnpm --filter @everkano/web build

  # ---------------------------------------------------------------------------
  api-db:
    name: API + DB (pgTAP RLS / ruff / mypy / pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ローカル Supabase の既定値（シークレットではない）。scripts/test-db.sh と pytest の統合テストが参照
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # マイグレーション + seed.sql が適用される（失敗すればこのステップで落ちる）。
      # テストに不要なサービスは起動しない（DB / Auth / REST / Kong のみ）。
      - name: Supabase ローカルスタック起動
        run: >-
          supabase start --workdir infra
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: RLS / 権限 / トリガーのテスト（pgTAP, A13）
        run: bash scripts/test-db.sh

      # メール確認必須（未確認パスワードでの乗っ取り防止）が config.toml から外れていないか
      - name: Auth 設定の静的検査（enable_confirmations 等）
        run: python3 infra/supabase/tests/auth/signup_hardening.py --static-only

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install（Prettier を DB 型の比較に使う）
        run: pnpm install --frozen-lockfile

      # scripts/ はリポジトリのどこから実行しても動く前提（scripts/README.md）。
      # その回帰も検出するため、あえてサブディレクトリから実行する
      - name: DB 型（database.types.ts）がマイグレーションと一致しているか
        working-directory: apps/web
        run: bash ../../scripts/check-db-types.sh

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: uv sync
        working-directory: apps/api
        run: uv sync --frozen

      - name: ruff check
        working-directory: apps/api
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: mypy (strict)
        working-directory: apps/api
        run: uv run mypy app

      - name: ペルソナ YAML の検証
        working-directory: apps/api
        run: uv run python scripts/validate_personas.py

      - name: OpenAPI（docs/api/openapi.json）が最新か
        working-directory: apps/api
        run: uv run python scripts/export_openapi.py --check

      - name: pytest（統合テストはローカル Supabase の Postgres を使用）
        working-directory: apps/api
        run: uv run pytest

      - name: 失敗時の診断情報
        if: failure()
        run: |
          supabase status --workdir infra || true
          docker ps -a || true
          docker logs "$(docker ps -aqf name=supabase_db_)" 2>&1 | tail -n 200 || true

      - name: Supabase 停止
        if: always()
        run: supabase stop --workdir infra --no-backup || true

  # ---------------------------------------------------------------------------
  e2e:
    name: E2E（受け入れ基準 / Playwright・手動実行のみ）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      E2E_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Realtime（DM・コメント同期）と Mailpit（ログインコード取得）が必要
      - name: Supabase ローカルスタック起動
        run: supabase start --workdir infra -x storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          (cd apps/api && uv sync --frozen)
          pnpm --filter @everkano/web exec playwright install --with-deps chromium

      - name: 環境変数ファイル生成（supabase status から）
        run: bash scripts/setup-env.sh --force

      - name: API 起動（モック LLM / ハッシュ埋め込み）
        working-directory: apps/api
        run: |
          nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && break; sleep 1; done

      - name: Web ビルド・起動（本番ビルド）
        working-directory: apps/web
        run: |
          pnpm build
          nohup pnpm start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/login && break; sleep 1; done

      - name: Playwright E2E
        run: pnpm --filter @everkano/web e2e

      - name: レポート保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

      - name: 失敗時のサーバーログ
        if: failure()
        run: |
          tail -n 200 /tmp/api.log || true
          tail -n 200 /tmp/web.log || true

      - name: Supabase 停止
        if: always()
        run: supabase stop --workdir infra --no-backup || true
