[project]
name = "portrait-studio-api"
version = "0.1.0"
description = "portrait-studio — FastAPI backend: character registry, ComfyUI job queue, insightface quality / similarity, audit log"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
  "httpx>=0.27",
  "websockets>=13",
  "python-multipart>=0.0.12",
  "pillow>=10.4",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "insightface==2.0",
  "onnxruntime>=1.18",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.uv]
# The app is not installed as a package; `app` is imported from the working directory (same as apps/api).
package = false
# insightface declares `opencv-python` (GUI build, needs libGL). We only ever use the headless build,
# so the GUI build is removed from the resolution. `onnxruntime-gpu` is never used (see docs/MODELS.md).
override-dependencies = ["opencv-python; sys_platform == 'never'"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "TID", "ARG", "PL",
]
ignore = [
  "PLR0913", # too many arguments
  "PLR2004", # magic value comparison
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0915", # too many statements
  "RUF001",  # ambiguous unicode (Japanese UI strings)
  "RUF002",
  "RUF003",
  "S311",    # random is used for seeds, not security
  "ASYNC109", # our own deadline handling inside the ComfyUI client takes a `timeout` argument on purpose
  "ASYNC240", # local-disk pathlib checks (sub-millisecond) in request handlers
  "N818",    # exception names without the Error suffix (ComfyUnavailable / JobFailed / JobCanceled)
  "PLR0917", # FastAPI query parameters are positional by nature
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002", "S608", "PLC0415", "PT018", "E501"]
"tools/**" = ["ARG001", "S108"]
"scripts/**" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["insightface", "insightface.*", "cv2", "cv2.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
