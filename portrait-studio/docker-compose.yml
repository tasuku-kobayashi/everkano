# =============================================================================
# portrait-studio — ComfyUI (GPU) + API/UI. Local only: both ports are published on 127.0.0.1.
#
#   cp .env.example .env && edit API_KEY (required) and MODELS_DIR
#   scripts/install_models.sh            # models into ${MODELS_DIR} (ext4 side of WSL2, never /mnt/c)
#   docker compose up --build            # ComfyUI :8188 (127.0.0.1) + API/UI :8000 (127.0.0.1)
#   scripts/verify_env.sh                # cu128 / sm_120 / nodes / workflows
# =============================================================================
services:
  comfyui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.11.0-cuda12.8-cudnn9-devel}
        COMFYUI_REF: ${COMFYUI_REF:-651ca296a73cd21c12a57eb8741d52e40dc6528f}
        # uid/gid of the WSL2 user that owns ${MODELS_DIR} / ${DATA_DIR} (id -u / id -g); ComfyUI and the API
        # (below) both run as this user so the bind-mounted volumes stay writable
        COMFY_UID: ${COMFY_UID:-1000}
        COMFY_GID: ${COMFY_GID:-1000}
    image: portrait-studio-comfyui:local
    # ComfyUI's /prompt executes arbitrary workflows without auth: never publish on 0.0.0.0
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - ${MODELS_DIR:-./data/models}:/opt/ComfyUI/models
      - ${DATA_DIR:-./data}/comfy-input:/opt/ComfyUI/input
      - ${DATA_DIR:-./data}/comfy-output:/opt/ComfyUI/output
    environment:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    # insightface / dataloaders need more shared memory than Docker's 64 MB default
    shm_size: "8gb"
    # String form (not a YAML array): COMFY_EXTRA_ARGS can hold zero, one or several flags (e.g. "--lowvram
    # --reserve-vram 512") and compose word-splits the whole line, so an empty/unset value contributes no stray
    # argv token — an array element would always be passed literally, even empty, and main.py rejects that.
    command: "--preview-method none ${COMFY_EXTRA_ARGS:-}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        # same host uid/gid as the comfyui service (see above) — /data is bind-mounted the same way
        API_UID: ${COMFY_UID:-1000}
        API_GID: ${COMFY_GID:-1000}
    image: portrait-studio-api:local
    depends_on:
      - comfyui
    # Only the keys the API reads are passed in (compose interpolates them from .env). The whole file is NOT
    # injected: CIVITAI_TOKEN and the image/model settings stay on the host.
    environment:
      API_KEY: ${API_KEY:?API_KEY is required (.env) — the API refuses to start without it}
      COMFY_URL: http://comfyui:8188
      DATA_DIR: /data
      WORKFLOWS_DIR: /app/workflows
      WEB_DIST_DIR: /app/web/dist
      COMPLIANCE_PATH: /app/docs/COMPLIANCE.md
      FACE_MODEL_ROOT: /models/insightface
      FACE_ENGINE: ${FACE_ENGINE:-insightface}
      FACE_MODEL_NAME: ${FACE_MODEL_NAME:-antelopev2}
      DEFAULT_CHECKPOINT: ${DEFAULT_CHECKPOINT:-}
      QUALITY_FACE_RATIO_MIN: ${QUALITY_FACE_RATIO_MIN:-0.08}
      QUALITY_DET_SCORE_MIN: ${QUALITY_DET_SCORE_MIN:-0.6}
      QUALITY_YAW_MAX_DEG: ${QUALITY_YAW_MAX_DEG:-15}
      QUALITY_SHARPNESS_MIN: ${QUALITY_SHARPNESS_MIN:-60}
      QUALITY_RECOMMEND_MIN: ${QUALITY_RECOMMEND_MIN:-0.75}
      QUALITY_ACCEPTABLE_MIN: ${QUALITY_ACCEPTABLE_MIN:-0.5}
      CLUSTER_THRESHOLD: ${CLUSTER_THRESHOLD:-0.5}
      SIMILARITY_GOOD: ${SIMILARITY_GOOD:-0.75}
      SIMILARITY_ACCEPTABLE: ${SIMILARITY_ACCEPTABLE:-0.60}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-1}
      VRAM_SAFETY_MARGIN_MB: ${VRAM_SAFETY_MARGIN_MB:-512}
      VRAM_ALLOW_UNMEASURED: ${VRAM_ALLOW_UNMEASURED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - ${DATA_DIR:-./data}:/data
      # antelopev2 for the API's insightface (same files ComfyUI uses): ${MODELS_DIR}/insightface/models/antelopev2
      - ${MODELS_DIR:-./data/models}/insightface:/models/insightface:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
