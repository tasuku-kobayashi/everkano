[project]
name = "everkano-api"
version = "0.1.0"
description = "everkano (Project P MVP) — Python API: DM chat / memory engine / Gate #1 moderation / audit log"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
  "httpx>=0.27",
  "asyncpg>=0.30",
  "pyjwt[crypto]>=2.9",
  "pyyaml>=6.0",
  "sentry-sdk[fastapi]>=2.0",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "asyncpg-stubs>=0.30",
]

[tool.uv]
# アプリはパッケージとしてインストールしない（/app 直下の `app` パッケージをそのまま import する）
package = false

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "TID", "ARG", "PL",
]
ignore = [
  "PLR0913", # too many arguments（サービス層のキーワード引数は許容）
  "PLR2004", # magic value comparison
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0915", # too many statements
  "RUF001",  # 全角文字（日本語）を含む文字列を許容
  "RUF002",
  "RUF003",
  "S311",    # random はセキュリティ用途ではない（自動返信の確率判定のみ）
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002", "S608"]
"scripts/**" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: ローカル Supabase Postgres（DATABASE_URL）が必要なテスト。接続できない場合は skip",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
