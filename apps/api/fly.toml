# =============================================================================
# Fly.io 設定 — everkano API（H5: Python API は Vercel ではなく別ホストで動かす）
#
# デプロイはリポジトリのルートから実行する（ビルドコンテキストに packages/ が必要なため）:
#   fly deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
#
# シークレットは fly secrets で登録する（H7: コミットしない。名前は .env.example を参照）:
#   fly secrets set --config apps/api/fly.toml \
#     DATABASE_URL='postgresql://...?sslmode=verify-full&sslrootcert=/app/certs/supabase-ca.crt' \
#     SUPABASE_URL='https://<project-ref>.supabase.co' \
#     LLM_API_KEY='sk-or-...' \
#     CORS_ALLOW_ORIGINS='https://<web>.vercel.app'
#   （任意）SUPABASE_JWT_SECRET（旧HS256方式のプロジェクトのみ）/ EMBEDDING_API_KEY / SENTRY_DSN
#   SENTRY_DSN を設定しても、アクセストークン・DM 本文・監査ログ・ローカル変数は送らない（app/core/observability.py）
#
# DB（Supabase）への接続は TLS 必須（staging / production では DATABASE_URL に sslmode=require 以上が無いと起動しない）。
# 推奨は verify-full（証明書と接続先ホスト名を検証する）。Supabase のルート証明書（ダッシュボードの
# Database Settings → SSL Configuration → Download certificate）を Fly のシークレットファイルとして配置する:
#   fly secrets set --config apps/api/fly.toml SUPABASE_DB_CA_CERT="$(base64 -w0 prod-ca-2021.crt)"
#   → 下の [[files]] のコメントを外してデプロイ。証明書を用意するまでは sslmode=require（暗号化のみ）でもよい。
#
# 本番に切り替える場合は APP_ENV を production にする（LLM_MODE=mock は起動時に拒否される）。
#
# プロセスグループ（同じイメージ）:
#   app    : API（uvicorn）。返答のレイテンシ（E8）を守るため、ジョブのワーカー・スケジューラは動かさない
#   worker : キャラクターエンジンの非同期ジョブ（記憶の抽出・好感度の評価など）と定期実行（予定の生成・状態・
#            自発メッセージ）。`python -m app.worker` は環境変数に関係なくワーカーとスケジューラを起動する。
#            複数台にしても定期実行は pg_try_advisory_lock で 1 台だけが行い、ジョブは FOR UPDATE SKIP LOCKED で分け合う
#   worker は HTTP を受けないので http_service の対象外（processes = ["app"]）。
#   スケールの例: fly scale count app=1 worker=1 --config apps/api/fly.toml
# =============================================================================
app = "everkano-api"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  # apps/api/Dockerfile の既定値と同じ（digest で固定。更新手順は Dockerfile の先頭）
  [build.args]
    PYTHON_IMAGE = "python:3.12.14-slim-trixie@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9"
    UV_IMAGE = "ghcr.io/astral-sh/uv:0.8.17@sha256:e4644cb5bd56fdc2c5ea3ee0525d9d21eed1603bccd6a21f887a938be7e85be1"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --no-access-log --timeout-graceful-shutdown 20"
  worker = "python -m app.worker"

[env]
  APP_ENV = "staging"
  LOG_LEVEL = "INFO"
  LLM_MODE = "live"
  LLM_BASE_URL = "https://openrouter.ai/api/v1"
  LLM_MODEL = "deepseek/deepseek-chat"
  # EMBEDDING_API_KEY を用意したら "live" に変更する（hash は開発用の簡易埋め込み）。
  # 切り替え（EMBEDDING_MODEL の変更も同じ）後は、既存の記憶を必ず再埋め込みすること。実行するまで
  # 既存の記憶の検索・重複排除が正しく動かない（hash と live はベクトル空間が別で、次元数が同じためエラーにならない）:
  #   fly secrets set --config apps/api/fly.toml EMBEDDING_API_KEY=...   # EMBEDDING_MODE を "live" にしてデプロイ
  #   fly ssh console --config apps/api/fly.toml -C "/opt/venv/bin/python /app/scripts/reembed_memories.py"
  # 手順の詳細は apps/api/README.md「埋め込み設定の切り替え」
  EMBEDDING_MODE = "hash"
  # Supavisor の transaction mode（:6543）経由で接続する場合は 0 にする
  DATABASE_STATEMENT_CACHE_SIZE = "100"
  AUDIT_LOG_PROMPTS = "true"
  # Fly のエッジ（プロキシ）経由の X-Forwarded-Proto を信頼する。クライアントIPは偽装できない Fly-Client-IP を記録する
  FORWARDED_ALLOW_IPS = "*"
  CLIENT_IP_HEADER = "Fly-Client-IP"
  # キャラクターエンジン: API（app）ではジョブ・定期実行を動かさない（worker プロセスグループが動かす。
  # [env] は全プロセスグループ共通だが、python -m app.worker はこの値に関係なく両方を起動する）
  ENGINE_WORKER_ENABLED = "false"
  ENGINE_SCHEDULER_ENABLED = "false"
  # 分析系（記憶・好感度）のモデルを分ける場合（空 = LLM_MODEL）
  # LLM_MODEL_ANALYSIS = "deepseek/deepseek-chat"

# verify-full 用の Supabase ルート証明書（上のコメント参照。シークレット SUPABASE_DB_CA_CERT は base64）
# [[files]]
#   guest_path = "/app/certs/supabase-ca.crt"
#   secret_name = "SUPABASE_DB_CA_CERT"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  # DM の応答待ちでコールドスタートさせないため常時 1 台は起動しておく
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # 1 マシンに届く同時リクエスト数。/chat・/chat/stream は 1 件で LLM 接続を 1 本（応答生成）と埋め込みを 1 本使う
  # （記憶の抽出はリクエストの後に worker で行う）。余裕を見て hard_limit × 2 は app/core/http.py の
  # HTTP_MAX_CONNECTIONS（200）以下にすること（tests/test_http_limits.py で検査）。
  # SSE（/chat/stream）も 1 リクエストとして数える（生成が終われば閉じる）。
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  processes = ["app"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
